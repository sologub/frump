[package]
name = "frump"
version = "0.1.0"
authors = ["Ruslan Sologub <sologub@gmail.com>"]
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
git2 = "0.19"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
fs2 = "0.4"
strsim = "0.11"
axum = "0.8"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "net"] }

[dev-dependencies]
proptest = "1.4"
